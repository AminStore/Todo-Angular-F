<div class="todo-container">
    <header class="todo-header">
        <h1>My Tasks</h1>
        <div class="add-task-container">
            <input type="text" placeholder="Add new task..." #newTask class="task-input">
            <button class="add-btn" (click)="addTask(newTask.value)">
                <i class="fas fa-plus"></i> Add
            </button>
        </div>
    </header>

    <div class="todo-filters">
        <button [class.active]="currentFilter === 'all'" (click)="filterTasks('all')">All</button>
        <button [class.active]="currentFilter === 'active'" (click)="filterTasks('active')">Active</button>
        <button [class.active]="currentFilter === 'completed'" (click)="filterTasks('completed')">Completed</button>
    </div>

    <div class="todo-list">
        <div *ngFor="let todo of filteredTodos" class="todo-item" [class.completed]="todo.completed">
            <div class="todo-content">
                <input type="checkbox" [checked]="todo.completed" (change)="toggleComplete(todo)">
                <span [class.strike]="todo.completed">{{todo.title}}</span>
            </div>
            <div class="todo-actions">
                <button class="edit-btn" (click)="editTodo(todo)">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="delete-btn" (click)="deleteTodo(todo)">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <footer class="todo-footer" *ngIf="todos.length > 0">
        <span>{{remainingTasks}} items left</span>
        <button class="clear-btn" *ngIf="completedTasks > 0" (click)="clearCompleted()">
            Clear completed
        </button>
    </footer>
</div>
